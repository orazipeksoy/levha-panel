<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Levha Panel">
<title>Plastik Levha Yönetim Paneli</title>
<style>
:root {
  --navy:#0A0714;--navy2:#241141;--ink:#ECEDF3;--mut:#A9ADC4;
  --line:#2E3040;--bg:#0A0B10;--card:#14151D;
  --green:#3DD6A0;--green-bg:#12291F;--red:#FB8585;--red-bg:#2A1518;
  --blue:#9E93F0;--amber:#F5B942;--amber-bg:#2E2410;--gold:#E3C05A;
  --teal:#2EC4B6;--teal-bg:#0F2422;
}
*{box-sizing:border-box;margin:0;}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
  /* Uygulama gibi davransın: yazılar seçilmesin, dokununca gri kutu çıkmasın */
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  overscroll-behavior-y:contain;}
/* Kopyalanabilir kalması gerekenler: form alanları ve seçilebilir işaretlenen metinler */
input,textarea,select,.secilebilir{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}
button,.tab,.btn,.chip,.turbtn,.sil-x,.item-row,.kpi{-webkit-user-select:none;user-select:none;}
header{background:linear-gradient(135deg,#0A0714 0%,#241141 55%,#3B2168 100%);padding:max(18px,env(safe-area-inset-top)) 20px 16px;border-bottom:1px solid #2E2148;}
.hdr-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-weight:900;color:#2EC4B6;font-size:11px;letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgba(46,196,182,.35);}
header h1{color:#fff;font-size:18px;font-weight:800;}
header .sub{color:#A79ECF;font-size:11px;display:block;margin-top:1px;}
.hdr-right{margin-left:auto;text-align:right;}
.hdr-kasa-lbl{color:#A79ECF;font-size:10px;text-transform:uppercase;letter-spacing:.08em;}
.hdr-kasa{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;}
.hdr-meta{display:flex;gap:10px;align-items:center;margin-top:10px;}
#sync-badge{font-size:11px;color:#A79ECF;}
.rst{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#C9BEEA;font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;}
nav{background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:0 8px;position:sticky;top:0;z-index:10;-webkit-overflow-scrolling:touch;}
.tab{border:none;background:transparent;padding:15px 14px;font-size:13px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;font-weight:700;white-space:nowrap;min-height:46px;}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);}
main{padding:16px;max-width:1150px;margin:0 auto;padding-bottom:max(28px,env(safe-area-inset-bottom));}
.card{background:linear-gradient(165deg,#1D1F2C 0%,var(--card) 55%);border-radius:14px;padding:16px;box-shadow:0 3px 12px rgba(5,8,20,.28);margin-bottom:14px;border:1px solid rgba(255,255,255,.03);}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:4px;font-weight:700;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
@media(max-width:700px){.kpi-grid{grid-template-columns:1fr 1fr;}}
.kpi{background:linear-gradient(165deg,#1E2130 0%,var(--card) 60%);border-radius:14px;padding:14px 16px;box-shadow:0 3px 10px rgba(5,8,20,.25);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.03);}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(46,196,182,.35),transparent);}
.kpi .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0;}
.trend{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;}
.trend.up{background:var(--green-bg);color:var(--green);}
.trend.down{background:var(--red-bg);color:var(--red);}
.trend.flat{background:#262837;color:var(--mut);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:8px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);border-bottom:2px solid var(--line);font-weight:800;}
td{padding:8px 9px;border-bottom:1px solid #262837;font-variant-numeric:tabular-nums;}
tr:last-child td{border-bottom:none;}
.num{text-align:right;}
input,select,textarea{border:1.5px solid #333648;border-radius:10px;padding:11px 12px;font-size:15px;width:100%;background:#1B1D28;color:var(--ink);-webkit-appearance:none;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(46,196,182,.15);border-color:var(--teal);}
textarea{resize:vertical;min-height:70px;}
.btn{background:linear-gradient(135deg,#1E4070,#2d5a9e);color:#fff;border:none;border-radius:11px;padding:14px 22px;font-size:15px;font-weight:800;cursor:pointer;width:100%;letter-spacing:.01em;}
.btn:active{filter:brightness(.88);}
.btn.danger{background:linear-gradient(135deg,#6B1D1D,#9e2d2d);}
.btn.success{background:linear-gradient(135deg,#0f4a35,#1a7a58);}
.btn.sm{padding:10px 15px;font-size:13px;width:auto;border-radius:9px;min-height:40px;}
.turbtn{flex:1;padding:13px;border-radius:11px;border:2px solid var(--line);font-weight:800;font-size:15px;cursor:pointer;background:#1B1D28;color:var(--mut);}
.turbtn.gelir-on{border-color:var(--green);background:var(--green-bg);color:var(--green);}
.turbtn.gider-on{border-color:var(--red);background:var(--red-bg);color:var(--red);}
.yesil{color:var(--green);font-weight:600;}
.kirmizi{color:var(--red);font-weight:600;}
.mavi{color:var(--blue);font-weight:600;}
.altin{color:var(--gold);font-weight:600;}
.teal{color:var(--teal);font-weight:600;}
.chip{border:1.5px solid var(--line);background:#1B1D28;color:var(--mut);font-size:13px;font-weight:700;padding:9px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;min-height:38px;}
.chip.on{background:var(--navy2);border-color:#5a4a8a;color:#C9BEEA;}
.chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.formgrid{display:grid;gap:12px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
@media(max-width:600px){.row2,.row3{grid-template-columns:1fr;}}
.mtitle{font-size:15px;font-weight:800;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.pill{font-size:10px;background:rgba(201,162,39,.14);color:var(--amber);padding:3px 9px;border-radius:12px;font-weight:800;}
.pill.g{background:var(--green-bg);color:var(--green);}
.pill.r{background:var(--red-bg);color:var(--red);}
.pill.b{background:#1a1e35;color:var(--blue);}
.pill.t{background:var(--teal-bg);color:var(--teal);}
.sil-x{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:6px 10px;font-weight:800;border-radius:6px;}
.sil-x:hover{background:var(--red-bg);}
.uyari{display:flex;align-items:center;gap:10px;background:var(--amber-bg);border:1px solid #4A3D1E;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
.uyari>span:nth-child(2){flex:1;}
.uyari.krit{background:var(--red-bg);border-color:#4A2328;}
.toast{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;background:var(--green);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.18);transition:opacity .3s;}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.item-row{display:flex;align-items:center;gap:8px;background:#1B1D28;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;}
.item-row .name{flex:1;font-weight:700;font-size:14px;}
.item-row .meta{font-size:12px;color:var(--mut);}
.item-row .stok-badge{font-size:13px;font-weight:800;padding:4px 12px;border-radius:8px;background:#1E2435;color:var(--teal);}
.stok-low{color:var(--amber)!important;background:var(--amber-bg)!important;}
.stok-zero{color:var(--red)!important;background:var(--red-bg)!important;}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.empty{text-align:center;padding:32px 16px;color:var(--mut);font-size:13px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#1D1F2C;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:800;margin-bottom:16px;color:var(--gold);}
.kalem-satir{display:flex;align-items:center;gap:6px;margin-bottom:8px;background:#14151D;padding:8px;border-radius:8px;}
.kalem-satir select,.kalem-satir input{flex:1;padding:7px 9px;font-size:13px;}
/* Charts */
.chart-wrap{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px;}
.chart-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%;}
.chart-bars{display:flex;gap:2px;align-items:flex-end;height:110px;width:100%;justify-content:center;}
.cbar{width:40%;max-width:18px;border-radius:3px 3px 0 0;min-height:2px;}
.cbar.g{background:var(--green);opacity:.85;}
.cbar.r{background:var(--red);opacity:.75;}
.cbar.t{background:var(--teal);opacity:.9;}
.cbar.a{background:var(--amber);opacity:.85;}
.chart-lbl{font-size:9.5px;color:var(--mut);font-weight:600;white-space:nowrap;}
/* PIN */
#kilit-ekrani{position:fixed;inset:0;background:linear-gradient(135deg,#0A0714 0%,#241141 60%,#3B2168 100%);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;}
.pin-logo{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:28px;border:1px solid rgba(46,196,182,.3);}
.pin-noktalar{display:flex;gap:14px;}
.pin-nokta{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:transparent;transition:all .15s ease;}
.pin-nokta.dolu{background:#2EC4B6;border-color:#2EC4B6;}
.pin-nokta.hata{background:#F87171;border-color:#F87171;animation:sallan .3s;}
@keyframes sallan{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.pin-tuslar{display:grid;grid-template-columns:repeat(3,64px);gap:12px;}
.pin-tus{width:64px;height:64px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font-size:22px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.pin-tus:active{background:rgba(46,196,182,.3);transform:scale(.95);}
.pin-tus.sil{font-size:16px;color:#C9BEEA;}
#kilit-mesaj{color:#A79ECF;font-size:13px;min-height:18px;}
#app-icerik{display:none;}
main{animation:fadeIn .18s ease-out;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
::-webkit-scrollbar{height:6px;width:6px;}
::-webkit-scrollbar-thumb{background:#3A3D52;border-radius:3px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;}
.bar-row .name{width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.bar-track{flex:1;height:12px;background:#262837;border-radius:7px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--navy2),var(--teal));border-radius:7px;min-width:2px;}
.bar-val{width:90px;text-align:right;font-weight:700;font-size:12px;}
.vardiya-btn{padding:8px 14px;border-radius:8px;border:1.5px solid var(--line);background:#1B1D28;color:var(--mut);font-size:13px;font-weight:700;cursor:pointer;}
.vardiya-btn.on{border-color:var(--teal);background:var(--teal-bg);color:var(--teal);}
.vardiya-grup{display:flex;gap:8px;flex-wrap:wrap;}
.durus-satir{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.durus-satir input,.durus-satir select{flex:1;}
.makine-rozet{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;background:rgba(158,147,240,.16);color:var(--blue);border:1px solid rgba(158,147,240,.3);vertical-align:middle;white-space:nowrap;}
/* Satış kalemi kartı — telefonda her alan etiketli ve tam genişlikte */
.kalem-kart{background:#12131B;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
.kalem-baslik{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--gold);font-weight:800;}
.kalem-alan{margin-bottom:9px;min-width:0;}
.kalem-alan .lbl{margin-bottom:4px;}
.kalem-alan select,.kalem-alan input{width:100%;}
.kalem-ikili{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.kalem-birlesik{display:flex;gap:5px;}
.kalem-birlesik input{flex:1;min-width:0;}
.kalem-birlesik select{flex:none;width:74px;padding:11px 4px;font-size:13px;}
.kalem-stok{font-size:12px;font-weight:700;margin:2px 0 9px;min-height:15px;}
.kalem-ozet{font-size:12.5px;color:var(--teal);font-weight:700;min-height:16px;}
@media(max-width:400px){ .kalem-ikili{grid-template-columns:1fr;} }
/* Stok kartı — telefonda da düzgün dursun */
.stok-kart{background:linear-gradient(165deg,#1D1F2C 0%,var(--card) 55%);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid rgba(255,255,255,.04);}
.stok-ust{display:flex;gap:12px;align-items:flex-start;}
.stok-bilgi{flex:1;min-width:0;}
.stok-ad{font-weight:800;font-size:15px;margin-bottom:5px;line-height:1.25;}
.stok-bilgi .meta{margin-top:5px;font-size:12px;color:var(--mut);line-height:1.5;}
.stok-sayi{text-align:right;flex:none;}
.stok-butonlar{display:flex;gap:8px;margin-top:12px;}
.stok-pm{flex:none;width:52px;min-height:42px;padding:0;font-size:21px;line-height:1;border-radius:10px;}
.stok-duzelt{flex:1;min-height:42px;padding:0 16px;font-size:14px;border-radius:10px;}
@media(max-width:480px){
  .stok-ust{flex-direction:column;gap:8px;}
  .stok-sayi{text-align:left;display:flex;align-items:center;gap:10px;}
  .stok-sayi>div:last-child{margin-top:0!important;}
}
.hatirlatma-uyari{background:var(--amber-bg);border:1px solid rgba(245,185,66,.4);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.gorusme-satir{border-left:2px solid var(--teal);padding:8px 0 8px 12px;margin-bottom:8px;}
.gorusme-tarih{font-size:11px;color:var(--mut);font-weight:700;}
.gorusme-not{font-size:13px;margin-top:3px;white-space:pre-wrap;-webkit-user-select:text;user-select:text;}
.must-detay{background:#12131B;border-radius:12px;padding:14px;margin-top:10px;border:1px solid var(--line);}
.tel-link{color:var(--teal);text-decoration:none;font-weight:700;-webkit-user-select:text;user-select:text;}
</style>
</head>
<body>

<!-- PIN LOCK -->
<div id="kilit-ekrani">
  <div class="pin-logo">🏭</div>
  <div style="text-align:center;">
    <div style="font-size:20px;font-weight:800;color:#fff;">Levha Yönetim Paneli</div>
    <div style="font-size:12px;color:#A79ECF;margin-top:4px;">Plastik Levha Üretim & Satış</div>
  </div>
  <div class="pin-noktalar" id="pin-noktalar">
    <div class="pin-nokta"></div><div class="pin-nokta"></div>
    <div class="pin-nokta"></div><div class="pin-nokta"></div>
  </div>
  <div id="kilit-mesaj">PIN kodunuzu girin</div>
  <div class="pin-tuslar">
    <button class="pin-tus" onclick="pinGir('1')">1</button>
    <button class="pin-tus" onclick="pinGir('2')">2</button>
    <button class="pin-tus" onclick="pinGir('3')">3</button>
    <button class="pin-tus" onclick="pinGir('4')">4</button>
    <button class="pin-tus" onclick="pinGir('5')">5</button>
    <button class="pin-tus" onclick="pinGir('6')">6</button>
    <button class="pin-tus" onclick="pinGir('7')">7</button>
    <button class="pin-tus" onclick="pinGir('8')">8</button>
    <button class="pin-tus" onclick="pinGir('9')">9</button>
    <button class="pin-tus sil" onclick="pinSil()">⌫</button>
    <button class="pin-tus" onclick="pinGir('0')">0</button>
    <button class="pin-tus sil" onclick="pinTemizle()">✕</button>
  </div>
</div>

<!-- APP -->
<div id="app-icerik">
<header>
  <div class="hdr-top">
    <div class="logo">LP</div>
    <div>
      <h1 style="font-size:16px;">Levha Yönetim Paneli</h1>
      <span class="sub" id="hdr-firma">Plastik Levha Üretim & Satış</span>
    </div>
    <div class="hdr-right">
      <div class="hdr-kasa-lbl">Kasa</div>
      <div class="hdr-kasa" id="hdr-kasa">₺0</div>
    </div>
  </div>
  <div class="hdr-meta">
    <span id="sync-badge" style="font-size:11px;color:#A79ECF">⟳ bağlanıyor</span>
    <span style="font-size:11px;color:#A79ECF;margin-left:6px">son: <span id="son-guncelleme">—</span></span>
    <button class="rst" onclick="kilidKapat()">🔒 Kilitle</button>
  </div>
</header>

<nav id="nav">
  <button class="tab on" onclick="tabGec('ozet',this)">📊 Özet</button>
  <button class="tab" onclick="tabGec('stok',this)">📦 Stok</button>
  <button class="tab" onclick="tabGec('satis',this)">💰 Satış</button>
  <button class="tab" onclick="tabGec('uretim',this)">🏭 Üretim</button>
  <button class="tab" onclick="tabGec('hammadde',this)">🧱 Hammadde</button>
  <button class="tab" onclick="tabGec('musteriler',this)">👥 Müşteriler<span id="must-rozet"></span></button>
  <button class="tab" onclick="tabGec('kasa',this)">🏦 Kasa</button>
  <button class="tab" onclick="tabGec('raporlar',this)">📈 Raporlar</button>
  <button class="tab" onclick="tabGec('ayarlar',this)">⚙️ Ayarlar</button>
</nav>

<main id="main-icerik">
<!-- Content rendered by JS -->
</main>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal" style="display:none;" onclick="modalKapat(event)">
  <div class="modal" id="modal-icerik"></div>
</div>

<div id="toast" style="display:none;" class="toast"></div>

<script>
// ── FIREBASE ─────────────────────────────────────────
const FB_URL = 'https://levha-panel-default-rtdb.firebaseio.com/levha.json';
let fbSonYazma = 0; // son bizim yazdığımız zaman (ms)

// ── DATA ──────────────────────────────────────────────
const ANAHTAR = 'levha_panel_v1';

// Beklenen tüm liste alanları
const LISTE_ALANLARI = ['urunler','boyutlar','kalinliklar','hammaddeler','makineler',
  'stok','satislar','uretimKayitlari','hammaddeStok','musteriler','kasaHareketleri'];

// ÖNEMLİ: Firebase Realtime DB boş dizileri SAKLAMAZ ve bazen diziyi
// {0:...,1:...} nesnesi olarak döndürür. Bu yüzden gelen veri her zaman
// normalize edilmeli — yoksa sayfalar boş açılır / çöker.
function veriNormalize(v){
  if(!v || typeof v!=='object') v = {};
  const vars = varsayilanVeri();
  if(typeof v.pin!=='string' || !v.pin) v.pin = vars.pin;
  if(typeof v.firma!=='string' || !v.firma) v.firma = vars.firma;
  // Tek seferlik: eski kayıtlarda kalan 1234 PIN'i 4758 yap
  if(v.pinSurum !== 2){
    if(v.pin === '1234') v.pin = '4758';
    v.pinSurum = 2;
  }
  LISTE_ALANLARI.forEach(alan=>{
    let x = v[alan];
    if(Array.isArray(x)) { v[alan] = x.filter(i=>i!=null); return; }
    // Firebase nesne olarak döndürdüyse diziye çevir
    if(x && typeof x==='object') { v[alan] = Object.values(x).filter(i=>i!=null); return; }
    v[alan] = [];
  });
  // Makine artık stoğun bir parçası — eski kayıtları uyarla
  if(!v.makineStokSurum){
    if(!v.makineler.length) v.makineler = vars.makineler.map(m=>({...m}));
    const ilkMakine = v.makineler[0]?.id || '';
    // Eski stok/satış kayıtlarına ilk makineyi ata (üretimde zaten makinaId var)
    v.stok.forEach(s=>{ if(!s.makinaId) s.makinaId = ilkMakine; });
    v.satislar.forEach(s=>(s.kalemler||[]).forEach(k=>{ if(!k.makinaId) k.makinaId = ilkMakine; }));
    v.uretimKayitlari.forEach(u=>{ if(!u.makinaId) u.makinaId = ilkMakine; });
    v.makineStokSurum = 1;
  }
  // Makinelerde artık desen alanı yok — eski alanı temizle
  v.makineler.forEach(mk=>{ if('makinaId' in mk) delete mk.makinaId; });
  // Müşteri alanlarını tamamla (CRM sonradan eklendi)
  v.musteriler.forEach(mu=>{
    if(!Array.isArray(mu.gorusmeler)) mu.gorusmeler = mu.gorusmeler && typeof mu.gorusmeler==='object' ? Object.values(mu.gorusmeler) : [];
    if(typeof mu.bakiye!=='number') mu.bakiye = 0;
  });
  return v;
}

// Firebase'den yükle (uygulama açılışında)
async function fbYukle(){
  try {
    const res = await fetch(FB_URL);
    if(res.ok){
      const veri = await res.json();
      if(veri && typeof veri === 'object' && veri.pin){
        D = veriNormalize(veri);
        localStorage.setItem(ANAHTAR, JSON.stringify(D));
        return true;
      }
    }
  } catch(e){ console.warn('Firebase yüklenemedi, localStorage kullanılıyor'); }
  return false;
}

// Gerçek zamanlı dinleyici (SSE — Firebase streaming)
function fbDinle(){
  const syncBadge = document.getElementById('sync-badge');
  fetch(FB_URL, { headers:{'Accept':'text/event-stream'} })
    .then(res=>{
      if(syncBadge) syncBadge.textContent = '🟢 Canlı';
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let tampon = '';
      let eventTuru = '';
      function oku(){
        reader.read().then(({done, value})=>{
          if(done){ setTimeout(fbDinle, 4000); return; }
          tampon += decoder.decode(value, {stream:true});
          const satirlar = tampon.split('\n');
          tampon = satirlar.pop();
          for(const satir of satirlar){
            if(satir.startsWith('event: ')) eventTuru = satir.slice(7).trim();
            else if(satir.startsWith('data: ') && eventTuru === 'put'){
              try{
                const payload = JSON.parse(satir.slice(6));
                // Bizim az önce yazdığımız veriyi yoksay (2 sn içindeyse)
                if(payload && payload.data && payload.data.pin && Date.now()-fbSonYazma > 2000){
                  D = veriNormalize(payload.data);
                  localStorage.setItem(ANAHTAR, JSON.stringify(D));
                  hdrGuncelle();
                  renderTab(aktifTab);
                  toast('🔄 Güncellendi','var(--teal)');
                }
              }catch(e){ console.warn('SSE ayrıştırma hatası:', e); }
            }
          }
          oku();
        }).catch(()=>{ if(syncBadge) syncBadge.textContent='🔴 Bağlantı yok'; setTimeout(fbDinle,4000); });
      }
      oku();
    })
    .catch(()=>{ if(syncBadge) syncBadge.textContent='🔴 Bağlantı yok'; setTimeout(fbDinle,5000); });
}

function simdi(){

// YEREL tarih (toISOString UTC verir; TR'de gece yarısından sonra bir gün geri kayardı)
function ymd(dt){
  const y=dt.getFullYear(), a=String(dt.getMonth()+1).padStart(2,'0'), g=String(dt.getDate()).padStart(2,'0');
  return `${y}-${a}-${g}`;
}
function bugun(){ return ymd(new Date()); }
function gunEkle(n){ const d=new Date(); d.setDate(d.getDate()+n); return ymd(d); }

function tarihStr(d){
  if(!d) return '—';
  const [y,a,g]=String(d).slice(0,10).split('-');
  if(!y||!a||!g) return String(d);
  return `${g}.${a}.${y}`;
}

function para(n){
  return '₺'+Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,6);
}

function urunAd(uid){ const u=D.urunler.find(x=>x.id===uid); return u?`${u.ad} ${u.renk||''}`.trim():'—'; }
function boyutAd(bid){ const b=D.boyutlar.find(x=>x.id===bid); return b?`${b.en}×${b.boy}`:'—'; }
function kalinlikAd(kid){ const k=D.kalinliklar.find(x=>x.id===kid); return k?`${k.mm}mm`:'—'; }
function hammaddeAd(hid){ const h=D.hammaddeler.find(x=>x.id===hid); return h?h.ad:'—'; }
function makineAd(mid){ const m=D.makineler.find(x=>x.id===mid); return m?m.ad:'—'; }
function musteriAd(mid){ const m=D.musteriler.find(x=>x.id===mid); return m?m.ad:'—'; }

// M² hesaplama
function boyutM2(bid){ const b=D.boyutlar.find(x=>x.id===bid); return b?+(b.en*b.boy/10000).toFixed(4):0; }
function m2Str(v){ return (+v).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' m²'; }
// Adet → m², m² → adet
function adettenM2(adet,bid){ return +(adet*boyutM2(bid)).toFixed(3); }
function m2denAdet(m2,bid){ const bm=boyutM2(bid); return bm?Math.ceil(m2/bm):0; }

function makineAd(mid){ const m=D.makineler.find(x=>x.id===mid); return m?m.ad:'Makine belirsiz'; }

// Stok kimliği: MAKİNE + ürün + boyut + kalınlık + hammadde
// (aynı ürün farklı makineden çıkarsa ayrı stok satırı olur — iç tasarımları farklı)
function stokAnahtar(k){
  return [k.urunId||'',k.boyutId||'',k.kalinlikId||'',k.hammaddeId||'',k.makinaId||''].join('|');
}
function stokBul(k){
  const a=stokAnahtar(k);
  return D.stok.find(s=>stokAnahtar(s)===a);
}

// Stok günceller ve GERÇEKTEN uygulanan farkı döndürür (iade/geri alma için)
function stokGuncelle(k,fark,maliyet){
  let s=stokBul(k);
  if(!s){
    s={id:uid(),urunId:k.urunId||'',boyutId:k.boyutId||'',kalinlikId:k.kalinlikId||'',
       hammaddeId:k.hammaddeId||'',makinaId:k.makinaId||'',adet:0,maliyet:maliyet||0};
    D.stok.push(s);
  }
  const eski=s.adet;
  s.adet=Math.max(0,s.adet+fark);
  if(maliyet) s.maliyet=maliyet;
  return s.adet-eski; // uygulanan gerçek fark
}

// HTML kaçış — isimlerde " ' < > olursa form bozulmasın
function esc(v){ return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Türkçe uyumlu küçük harf — 'İzmir'.toLowerCase() bozuk sonuç verir,
// aramada "izmir" yazınca "İzmir" bulunmazdı
function trKucuk(v){
  return String(v??'')
    .replace(/İ/g,'i').replace(/I/g,'ı').replace(/Ğ/g,'ğ').replace(/Ü/g,'ü')
    .replace(/Ş/g,'ş').replace(/Ö/g,'ö').replace(/Ç/g,'ç')
    .toLowerCase();
}
// tel: linki için telefonu temizle (boşluk, parantez, tire)
function telTemiz(v){ return String(v??'').replace(/[^\d+]/g,''); }
// Arama karşılaştırması: Türkçe harfleri de eşleştir (i↔ı, s↔ş, ...)
function aramaNorm(v){
  return trKucuk(v).replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u')
    .replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c');
}

          <span class="teal">${u.adet} levha</span>

function renderStok(m){
    m.innerHTML=`
  <div class="section-hdr">
    <div class="mtitle" style="margin:0">📦 Stok Listesi</div>
    <button class="btn sm success" onclick="stokDuzeltModal()">+ Stok Girişi</button>
  </div>
  ${D.makineler.length>1?`<div class="vardiya-grup" style="margin-bottom:12px">
    <button class="chip on" id="dfil-" onclick="stokMakineFiltre('')">Tüm Makineler</button>
    ${D.makineler.map(mk=>`<button class="chip" id="dfil-${mk.id}" onclick="stokMakineFiltre('${mk.id}')">${esc(mk.ad)}</button>`).join('')}
  </div>`:''}
  <div id="stok-liste"></div>`;
  stokListeRender();
}

let stokFiltreMakine='';
function stokMakineFiltre(did){
  stokFiltreMakine=did;
  document.querySelectorAll('[id^="dfil-"]').forEach(b=>b.classList.remove('on'));
  document.getElementById('dfil-'+did)?.classList.add('on');
  stokListeRender();
}

function stokListeRender(){
  const c=document.getElementById('stok-liste');
  if(!c) return;
  let liste=D.stok;
  if(stokFiltreMakine) liste=liste.filter(s=>(s.makinaId||'')===stokFiltreMakine);
  if(!liste.length){ c.innerHTML=`<div class="empty">${D.stok.length?'Bu makinede stok yok.':'Henüz stok kaydı yok. Üretim yapıldıkça stok otomatik güncellenir.'}</div>`; return; }
  const satir = liste.map(s=>{
    const cls = s.adet===0?'stok-zero':s.adet<10?'stok-low':'';
    const m2toplam = adettenM2(s.adet,s.boyutId);
    const bm2 = boyutM2(s.boyutId);
    return `<div class="stok-kart">
      <div class="stok-ust">
        <div class="stok-bilgi">
          <div class="stok-ad">${urunAd(s.urunId)}</div>
          <div><span class="makine-rozet">${esc(makineAd(s.makinaId))}</span></div>
          <div class="meta">${boyutAd(s.boyutId)} cm · ${kalinlikAd(s.kalinlikId)} · ${hammaddeAd(s.hammaddeId)}${bm2?` · <span style="color:var(--teal)">${m2Str(bm2)}/levha</span>`:''}</div>
        </div>
        <div class="stok-sayi">
          <div class="stok-badge ${cls}">${s.adet} levha</div>
          ${m2toplam?`<div style="font-size:11.5px;color:var(--teal);margin-top:4px;font-weight:700">${m2Str(m2toplam)}</div>`:''}
        </div>
      </div>
      <div class="stok-butonlar">
        <button class="btn danger stok-pm" onclick="stokHizli('${s.id}',-1)">−</button>
        <button class="btn success stok-pm" onclick="stokHizli('${s.id}',1)">+</button>
        <button class="btn stok-duzelt" onclick="stokDuzeltModal('${s.id}')">Düzelt</button>
      </div>
    </div>`;
  });
  c.innerHTML=satir.join('');
}

function stokHizli(sid,delta){
  const miktar=parseInt(prompt(delta>0?'Kaç levha eklenecek?':'Kaç levha çıkarılacak?','1')||'0');
  if(!miktar||isNaN(miktar)||miktar<=0) return;
  const s=D.stok.find(x=>x.id===sid);
  if(!s) return;
  s.adet=Math.max(0,s.adet+(delta>0?miktar:-miktar));
  kaydet(); stokListeRender();
  toast(`Stok güncellendi: ${s.adet} levha ✓`);
}

function stokDuzeltModal(sid){
  const s=sid?D.stok.find(x=>x.id===sid):null;
  modalAc(`<div class="modal-title">Stok ${s?'Düzelt':'Girişi'}</div>
  <div class="formgrid">
    <div><div class="lbl">Ürün</div>${urunSelectHTML('urunId',s?.urunId)}</div>
    <div><div class="lbl">Makine (hangi makineden çıktı)</div>${makineSelectHTML('makinaId',s?.makinaId)}</div>
    <div class="row2">
      <div><div class="lbl">Boyut</div>${boyutSelectHTML('boyutId',s?.boyutId)}</div>
      <div><div class="lbl">Kalınlık</div>${kalinlikSelectHTML('kalinlikId',s?.kalinlikId)}</div>
    </div>
    <div><div class="lbl">Hammadde</div>${hammaddeSelectHTML('hammaddeId',s?.hammaddeId)}</div>
    <div class="row2">
      <div><div class="lbl">Adet (levha)</div><input type="number" id="stok-adet" min="0" value="${s?.adet??0}"></div>
      <div><div class="lbl">Birim Maliyet (₺)</div><input type="number" id="stok-maliyet" min="0" step="0.01" value="${s?.maliyet??0}"></div>
    </div>
    <button class="btn success" onclick="stokKaydet('${sid||''}')">Kaydet</button>
    ${sid?`<button class="btn danger" onclick="stokSil('${sid}')">Bu Stok Satırını Sil</button>`:''}
    <button class="btn" onclick="modalKapatDirekt()">İptal</button>
  </div>`);
}

function stokKaydet(sid){
  const modal=document.getElementById('modal-icerik');
  const get=n=>modal.querySelector(`[name="${n}"]`)?.value||'';
  const anahtar={urunId:get('urunId'),boyutId:get('boyutId'),kalinlikId:get('kalinlikId'),
                 hammaddeId:get('hammaddeId'),makinaId:get('makinaId')};
  const adet=parseInt(document.getElementById('stok-adet').value)||0;
  const maliyet=parseFloat(document.getElementById('stok-maliyet').value)||0;
  if(!anahtar.urunId||!anahtar.boyutId||!anahtar.kalinlikId||!anahtar.hammaddeId){
    toast('Ürün, boyut, kalınlık ve hammadde zorunlu!','var(--red)'); return;
  }
  if(D.makineler.length && !anahtar.makinaId){ toast('Makine seçin!','var(--red)'); return; }
  if(sid){
    const s=D.stok.find(x=>x.id===sid);
    if(s){
      // Aynı kimlikte başka satır varsa çakışmayı önle
      const cakisan=D.stok.find(x=>x.id!==sid&&stokAnahtar(x)===stokAnahtar(anahtar));
      if(cakisan){ toast('Bu özellikte başka bir stok satırı zaten var!','var(--red)'); return; }
      Object.assign(s,anahtar,{adet,maliyet});
    }
  } else {
    let s=stokBul(anahtar);
    if(s){ s.adet=adet; s.maliyet=maliyet; }
    else D.stok.push({id:uid(),...anahtar,adet,maliyet});
  }
  kaydet(); modalKapatDirekt(); renderTab('stok'); toast('Stok güncellendi ✓');
}

function stokSil(sid){
  const s=D.stok.find(x=>x.id===sid);
  if(!s) return;
  if(!confirm(`"${urunAd(s.urunId)} ${makineAd(s.makinaId)} ${boyutAd(s.boyutId)}" stok satırı silinsin mi?\n\nMevcut: ${s.adet} levha`)) return;
  D.stok=D.stok.filter(x=>x.id!==sid);
  kaydet(); modalKapatDirekt(); renderTab('stok'); toast('Stok satırı silindi','var(--amber)');
}

let satisKalemler=[];
function satisModal(){

  satisModalRender();
}

function satisModalRender(){
  modalAc(`<div class="modal-title">Yeni Satış</div>
  <div class="formgrid">
    <div class="row2">
      <div><div class="lbl">Tarih</div><input type="date" id="s-tarih" value="${bugun()}"></div>

function kalemSatirHTML(k,i){
  const stokVar = k.urunId ? (stokBul(k)?.adet ?? null) : null;
  return `<div class="kalem-kart" id="kalem-${k.id}">
    <div class="kalem-baslik">
      <span>Kalem ${i+1}</span>
      <button class="sil-x" onclick="kalemSil(${i})">×</button>
    </div>
    <div class="kalem-alan"><div class="lbl">Ürün</div>${urunSelectHTML(`urun_${i}`,k.urunId,'')}</div>
    <div class="kalem-alan"><div class="lbl">Makine</div>${makineSelectHTML(`makine_${i}`,k.makinaId)}</div>
    <div class="kalem-ikili">
      <div class="kalem-alan"><div class="lbl">Boyut</div>${boyutSelectHTML(`boyut_${i}`,k.boyutId)}</div>
      <div class="kalem-alan"><div class="lbl">Kalınlık</div>${kalinlikSelectHTML(`kalinlik_${i}`,k.kalinlikId)}</div>
    </div>

    <div class="kalem-stok" id="kstok_${i}" style="color:${stokVar===null?'var(--mut)':stokVar>0?'var(--green)':'var(--red)'}">${k.urunId?(stokVar===null?'stok kaydı yok':`stok: ${stokVar}`):''}</div>

          <select id="kbirim_${i}" onchange="kalemBirimDegis(${i})">
            <option value="adet"${k.birim!=='m2'?' selected':''}>Adet</option>
            <option value="m2"${k.birim==='m2'?' selected':''}>m²</option>
          </select>
        </div>
      </div>
      <div class="kalem-alan">
        <div class="lbl">Birim Fiyat</div>
        <div class="kalem-birlesik">
          <input type="number" placeholder="₺" min="0" step="0.01" value="${k.birimFiyat||''}" id="kfiyat_${i}" onchange="kalemHesapla(${i})">
          <select id="kfiyatbirim_${i}" onchange="kalemHesapla(${i})">
            <option value="adet"${k.fiyatBirim!=='m2'?' selected':''}>/adet</option>
            <option value="m2"${k.fiyatBirim==='m2'?' selected':''}>/m²</option>

// Ekrandaki değerleri diziye yaz (satır eklenirken/silinirken kaybolmasın)
function kalemleriOku(){
  const modal=document.getElementById('modal-icerik');
  if(!modal) return;
  satisKalemler.forEach((k,i)=>{
    k.urunId=modal.querySelector(`[name="urun_${i}"]`)?.value||'';
    k.makinaId=modal.querySelector(`[name="makine_${i}"]`)?.value||'';
    k.boyutId=modal.querySelector(`[name="boyut_${i}"]`)?.value||'';
    k.kalinlikId=modal.querySelector(`[name="kalinlik_${i}"]`)?.value||'';
    k.hammaddeId=modal.querySelector(`[name="hammadde_${i}"]`)?.value||'';
    k.birim=document.getElementById(`kbirim_${i}`)?.value||'adet';
    k.fiyatBirim=document.getElementById(`kfiyatbirim_${i}`)?.value||'adet';
    k.miktar=parseFloat(document.getElementById(`kmiktar_${i}`)?.value)||0;
    k.birimFiyat=parseFloat(document.getElementById(`kfiyat_${i}`)?.value)||0;
  });
}

function kalemleriCiz(){
  document.getElementById('kalem-listesi').innerHTML=satisKalemler.map((k,i)=>kalemSatirHTML(k,i)).join('');
  satisKalemler.forEach((k,i)=>kalemHesapla(i));
}

function kalemBirimDegis(i){
  // m² seçilince boyut seçimini iptal etmeyin, sadece placeholder güncelle
  const birim=document.getElementById(`kbirim_${i}`)?.value;
  const inp=document.getElementById(`kmiktar_${i}`);
  if(inp) inp.placeholder=birim==='m2'?'m²':'Adet';
  kalemHesapla(i);
}

function kalemHesapla(i){
  const birim=document.getElementById(`kbirim_${i}`)?.value||'adet';
  const miktar=parseFloat(document.getElementById(`kmiktar_${i}`)?.value)||0;
  const modal=document.getElementById('modal-icerik');
  const anahtar={
    urunId:modal?.querySelector(`[name="urun_${i}"]`)?.value||'',
    makinaId:modal?.querySelector(`[name="makine_${i}"]`)?.value||'',
    boyutId:modal?.querySelector(`[name="boyut_${i}"]`)?.value||'',
    kalinlikId:modal?.querySelector(`[name="kalinlik_${i}"]`)?.value||'',
    hammaddeId:modal?.querySelector(`[name="hammadde_${i}"]`)?.value||''
  };
  const {urunId,boyutId}=anahtar;
  const gs=document.getElementById(`kadet-goster_${i}`);
  let istenenAdet=0;
  if(gs){
    if(birim==='m2'&&boyutId&&miktar){
      istenenAdet=m2denAdet(miktar,boyutId);
      gs.textContent=`= ${istenenAdet} levha (${m2Str(boyutM2(boyutId))}/levha)`;
    } else {
      istenenAdet=Math.round(miktar);
      if(boyutId&&istenenAdet) gs.textContent=`= ${m2Str(adettenM2(istenenAdet,boyutId))}`;
      else gs.textContent='';
    }
  }
  // Canlı stok göstergesi
  const st=document.getElementById(`kstok_${i}`);
  if(st){
    if(!urunId){ st.textContent=''; return; }
    const s=stokBul(anahtar);
    if(!s){ st.textContent='stok kaydı yok'; st.style.color='var(--mut)'; }
    else if(istenenAdet>s.adet){ st.textContent=`⚠ stok: ${s.adet} (yetersiz!)`; st.style.color='var(--red)'; }
    else { st.textContent=`stok: ${s.adet}`; st.style.color='var(--green)'; }
  }
}

// Kalem satırındaki select'ler değişince stok/m² göstergesini tazele
document.addEventListener('change', e=>{
  const nm=e.target?.getAttribute?.('name')||'';
  const m=nm.match(/^(?:urun|makine|boyut|kalinlik|hammadde)_(\d+)$/);
  if(m) kalemHesapla(+m[1]);
});

function kalemEkle(){
  kalemleriOku();
  satisKalemler.push({id:uid(),urunId:'',makinaId:'',boyutId:'',kalinlikId:'',hammaddeId:'',birim:'adet',fiyatBirim:'adet',miktar:0,birimFiyat:0});
  kalemleriCiz();
}

function kalemSil(i){
  kalemleriOku();
  if(satisKalemler.length<=1){ toast('En az bir kalem olmalı','var(--amber)'); return; }
  satisKalemler.splice(i,1);
  kalemleriCiz();
}

function satisKaydet(){
  const modal=document.getElementById('modal-icerik');
  const tarih=document.getElementById('s-tarih').value||bugun();
  const musteriAdiGiris=(document.getElementById('musteriId-inp')?.value||'').trim();
  // Var olan müşteriyle eşleştir; yoksa yeni müşteri oluştur ve ID'sini kullan
  let musteriId='';
  if(musteriAdiGiris){
    const eslesen=D.musteriler.find(x=>trKucuk(x.ad)===trKucuk(musteriAdiGiris));
    if(eslesen) musteriId=eslesen.id;
    else {
      musteriId=uid();
      D.musteriler.push({id:musteriId,ad:musteriAdiGiris,telefon:'',sehir:'',adres:'',bakiye:0});
    }
  }
  const musteriAdKayit=musteriAdiGiris||'Perakende';
  const tahsilat=parseFloat(document.getElementById('s-tahsilat').value)||0;
  const not=document.getElementById('s-not').value;
  const kalemler=[];
  let toplam=0;
  for(let i=0;i<satisKalemler.length;i++){
    const anahtar={
      urunId:modal.querySelector(`[name="urun_${i}"]`)?.value||'',
      makinaId:modal.querySelector(`[name="makine_${i}"]`)?.value||'',
      boyutId:modal.querySelector(`[name="boyut_${i}"]`)?.value||'',
      kalinlikId:modal.querySelector(`[name="kalinlik_${i}"]`)?.value||'',
      hammaddeId:modal.querySelector(`[name="hammadde_${i}"]`)?.value||''
    };
    const {urunId,makinaId,boyutId,kalinlikId}=anahtar;
    const birim=document.getElementById(`kbirim_${i}`)?.value||'adet';
    const fiyatBirim=document.getElementById(`kfiyatbirim_${i}`)?.value||'adet';
    const miktar=parseFloat(document.getElementById(`kmiktar_${i}`)?.value)||0;
    const birimFiyat=parseFloat(document.getElementById(`kfiyat_${i}`)?.value)||0;
    if(!urunId||!miktar) continue;
    if(!boyutId){ toast(`${i+1}. kalemde boyut seçilmedi!`,'var(--red)'); return; }
    if(D.makineler.length && !makinaId){ toast(`${i+1}. kalemde makine seçilmedi!`,'var(--red)'); return; }
    // m² veya adet çevir
    let adet, satisM2;
    if(birim==='m2'){
      satisM2=miktar;
      adet=m2denAdet(miktar,boyutId);
    } else {
      adet=Math.round(miktar);
      satisM2=adettenM2(adet,boyutId);
    }
    // Stok yeterlilik kontrolü
    const stokKaydi=stokBul(anahtar);
    const mevcut=stokKaydi?stokKaydi.adet:0;
    if(adet>mevcut){
      const ad=`${urunAd(urunId)} · ${makineAd(makinaId)} · ${boyutAd(boyutId)} · ${kalinlikAd(kalinlikId)}`;
      if(!confirm(`⚠ STOK YETERSİZ\n\n${ad}\nİstenen: ${adet} levha\nMevcut: ${mevcut} levha\n\nYine de satışı kaydetmek istiyor musunuz?\n(Stok eksiye düşmez, 0 olur)`)) return;
    }
    // Fiyat hesabı
    let kalemToplam;
    if(fiyatBirim==='m2') kalemToplam=satisM2*birimFiyat;
    else kalemToplam=adet*birimFiyat;
    // Stok düş — gerçekten düşen miktarı sakla (silinince doğru iade için)
    const dusen=stokGuncelle(anahtar,-adet);
    kalemler.push({...anahtar,adet,dusulen:-dusen,satisM2,birimFiyat,fiyatBirim,birim});
    toplam+=kalemToplam;
  }
  if(!kalemler.length){ toast('En az bir kalem girin!','var(--red)'); return; }
  const musteriAd2=musteriAdKayit;
  D.satislar.push({id:uid(),tarih,musteriId,musteriAd:musteriAd2,kalemler,toplam,tahsilat,not});
  // Kasa hareketi
  if(tahsilat>0) D.kasaHareketleri.push({id:uid(),tarih,tur:'gelir',aciklama:`Satış: ${musteriAd2}`,tutar:tahsilat,kategori:'Satış'});
  // Müşteri bakiye güncelle
  if(musteriId){
    const mu=D.musteriler.find(x=>x.id===musteriId);
    if(mu) mu.bakiye=(mu.bakiye||0)+(toplam-tahsilat);
  }
  kaydet(); modalKapatDirekt(); renderTab('satis'); toast(`Satış kaydedildi: ${para(toplam)} ✓`);
}

function satisSil(id){
  if(!confirm('Bu satışı silmek istediğinize emin misiniz?\n\nStok, kasa ve müşteri bakiyesi geri alınacak.')) return;
  const s=D.satislar.find(x=>x.id===id);
  if(s){
    // Stok geri yükle (sadece gerçekten düşen kadar)
    (s.kalemler||[]).forEach(k=>{
      const geri = k.dusulen!==undefined ? k.dusulen : k.adet;
      if(geri>0) stokGuncelle(k,geri);
    });
    // Kasa hareketini geri al
    if(s.tahsilat>0){
      D.kasaHareketleri=D.kasaHareketleri.filter(h=>
        !(h.tarih===s.tarih && h.tur==='gelir' && h.tutar===s.tahsilat && h.kategori==='Satış'
          && h.aciklama===`Satış: ${s.musteriAd||musteriAd(s.musteriId)}`)
      );
    }
    // Müşteri bakiyesini geri al
    if(s.musteriId){
      const mu=D.musteriler.find(x=>x.id===s.musteriId);
      if(mu) mu.bakiye=(mu.bakiye||0)-(s.toplam-s.tahsilat);
    }
    D.satislar=D.satislar.filter(x=>x.id!==id);
  }
  kaydet(); satisListeRender(); toast('Satış silindi ve geri alındı','var(--amber)');
}

function uretimKaydet(){
  const modal=document.getElementById('modal-icerik');
  const tarih=document.getElementById('u-tarih').value||bugun();
  const makinaId=modal.querySelector('[name="makinaId"]')?.value||'';
  const anahtar={
    urunId:modal.querySelector('[name="urunId"]')?.value||'',
    makinaId,
    boyutId:modal.querySelector('[name="boyutId"]')?.value||'',
    kalinlikId:modal.querySelector('[name="kalinlikId"]')?.value||'',
    hammaddeId:modal.querySelector('[name="hammaddeId"]')?.value||''
  };
  const {urunId,boyutId,kalinlikId,hammaddeId}=anahtar;
  const adet=parseInt(document.getElementById('u-adet').value)||0;
  const hammaddeMiktar=parseFloat(document.getElementById('u-hm').value)||0;
  const operatör=document.getElementById('u-operator').value;
  const vardiya=window._uretimVardiya||'Sabah';
  const not=document.getElementById('u-not').value;
  if(!urunId||!adet){ toast('Ürün ve adet gerekli!','var(--red)'); return; }
  // Duruşları topla
  const duruslar=uretimDuruslar.map((d,i)=>({
    sure:parseInt(document.getElementById(`dsure_${i}`)?.value)||0,
    neden:document.getElementById(`dneden_${i}`)?.value||''
  })).filter(d=>d.sure>0);
  if(!boyutId){ toast('Boyut seçilmedi!','var(--red)'); return; }
  if(D.makineler.length && !makinaId){ toast('Makine seçilmedi!','var(--red)'); return; }
  // Hammadde yeterlilik kontrolü
  if(hammaddeId&&hammaddeMiktar>0){
    const hs=D.hammaddeStok.find(x=>x.hammaddeId===hammaddeId);
    const mevcut=hs?hs.miktar:0;
    if(hammaddeMiktar>mevcut){
      const h=D.hammaddeler.find(x=>x.id===hammaddeId);
      if(!confirm(`⚠ HAMMADDE YETERSİZ\n\n${hammaddeAd(hammaddeId)}\nGerekli: ${hammaddeMiktar} ${h?.birim||''}\nMevcut: ${mevcut} ${h?.birim||''}\n\nYine de üretimi kaydetmek istiyor musunuz?`)) return;
    }
  }
  // Stok artır (makine dahil)
  stokGuncelle(anahtar,adet);
  // Hammadde stok düş
  if(hammaddeId&&hammaddeMiktar>0){
    let hs=D.hammaddeStok.find(x=>x.hammaddeId===hammaddeId);
    if(hs) hs.miktar=Math.max(0,hs.miktar-hammaddeMiktar);
    else D.hammaddeStok.push({id:uid(),hammaddeId,miktar:0,birimFiyat:0});
  }
  D.uretimKayitlari.push({id:uid(),tarih,makinaId,...anahtar,adet,hammaddeMiktar,operatör,vardiya,duruslar,not});
  kaydet(); modalKapatDirekt(); renderTab('uretim'); toast(`${adet} levha üretim kaydedildi ✓`);
}

function uretimSil(id){
  if(!confirm('Bu üretim kaydını silmek istediğinize emin misiniz?\n\nÜrün stoğu düşecek, harcanan hammadde geri gelecek.')) return;
  const u=D.uretimKayitlari.find(x=>x.id===id);
  if(u){
    // Üretilen levhaları stoktan düş
    stokGuncelle(u,-u.adet);
    // Harcanan hammaddeyi geri ekle
    if(u.hammaddeId && u.hammaddeMiktar>0){
      let hs=D.hammaddeStok.find(x=>x.hammaddeId===u.hammaddeId);
      if(hs) hs.miktar=(hs.miktar||0)+u.hammaddeMiktar;
      else D.hammaddeStok.push({id:uid(),hammaddeId:u.hammaddeId,miktar:u.hammaddeMiktar,birimFiyat:0});
    }
  }
  D.uretimKayitlari=D.uretimKayitlari.filter(x=>x.id!==id);
  kaydet(); uretimListeRender(); toast('Üretim kaydı silindi ve geri alındı','var(--amber)');
}

    yetkili:document.getElementById('mu-yetkili').value.trim(),
    telefon:document.getElementById('mu-tel').value.trim(),
    sehir:document.getElementById('mu-sehir').value.trim(),
    email:document.getElementById('mu-email').value.trim(),
    adres:document.getElementById('mu-adres').value.trim(),
    vergiDairesi:document.getElementById('mu-vd').value.trim(),
    vergiNo:document.getElementById('mu-vno').value.trim()
  };
  if(mid){ const mu=D.musteriler.find(x=>x.id===mid); if(mu) Object.assign(mu,obj); }
  else {
    const yeniId=uid();
    D.musteriler.push({id:yeniId,...obj,bakiye:0,gorusmeler:[],hatirlatmaTarih:'',hatirlatmaNot:''});
    acikMusteri=yeniId;
  }
  kaydet(); modalKapatDirekt(); renderTab('musteriler'); toast('Müşteri kaydedildi ✓');
}

function musteriSil(id){
  const mu=D.musteriler.find(x=>x.id===id);
  const satisSayi=D.satislar.filter(s=>s.musteriId===id).length;
  if(!confirm(`"${mu?.ad||''}" silinsin mi?${satisSayi?`\n\nBu müşterinin ${satisSayi} satış kaydı var — satışlar silinmez, müşteri adı kayıtlarda kalır.`:''}`)) return;
  D.musteriler=D.musteriler.filter(x=>x.id!==id);
  if(acikMusteri===id) acikMusteri='';
  kaydet(); renderTab('musteriler'); toast('Müşteri silindi','var(--amber)');
}

function gorusmeKaydet(mid){
  const mu=D.musteriler.find(x=>x.id===mid); if(!mu) return;
  const not=document.getElementById('g-not').value.trim();
  if(!not){ toast('Görüşme notu boş olamaz!','var(--red)'); return; }
  const tarih=document.getElementById('g-tarih').value||bugun();
  if(!Array.isArray(mu.gorusmeler)) mu.gorusmeler=[];
  mu.gorusmeler.push({id:uid(),tarih,not});
  // Hatırlatma istendiyse kur
  if(document.getElementById('g-hatirlat')?.checked){
    const ht=document.getElementById('g-hattarih')?.value;
    if(ht){ mu.hatirlatmaTarih=ht; mu.hatirlatmaNot=not.slice(0,120); }
  }
  acikMusteri=mid;
  kaydet(); modalKapatDirekt(); renderTab('musteriler'); toast('Görüşme kaydedildi ✓');
}

function gorusmeSil(mid,gid){
  const mu=D.musteriler.find(x=>x.id===mid); if(!mu) return;
  if(!confirm('Bu görüşme kaydı silinsin mi?')) return;
  mu.gorusmeler=(mu.gorusmeler||[]).filter(g=>g.id!==gid);
  kaydet(); musteriListeRender(); toast('Görüşme silindi','var(--amber)');
}

function hatirlatKisayol(gun){

function renderKasa(m){
  const kasa=D.kasaHareketleri.reduce((s,h)=>s+(h.tur==='gelir'?h.tutar:-h.tutar),0);

  const gider=D.kasaHareketleri.filter(h=>h.tur==='gider').reduce((s,h)=>s+h.tutar,0);
  m.innerHTML=`
  <div class="kpi-grid">
    <div class="kpi"><div class="lbl">Kasa Bakiyesi</div><div class="v" style="color:var(--teal)">${para(kasa)}</div></div>
    <div class="kpi"><div class="lbl">Toplam Gelir</div><div class="v" style="color:var(--green)">${para(gelir)}</div></div>
    <div class="kpi"><div class="lbl">Toplam Gider</div><div class="v" style="color:var(--red)">${para(gider)}</div></div>
    <div class="kpi"><div class="lbl">Kâr</div><div class="v" style="color:${gelir-gider>=0?'var(--green)':'var(--red)'}">${para(gelir-gider)}</div></div>
  </div>
  <div class="card">
    <div class="section-hdr">
      <div class="mtitle" style="margin:0">🏦 Kasa Hareketleri</div>
      <button class="btn sm success" onclick="kasaHareketModal()">+ Hareket Ekle</button>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>Tarih</th><th>Açıklama</th><th>Kategori</th><th class="num">Tutar</th><th></th></tr></thead>
      <tbody id="kasa-tbody"></tbody>
    </table></div>
  </div>`;
  const tbody=document.getElementById('kasa-tbody');
  if(tbody){
    const liste=[...D.kasaHareketleri].reverse();
    tbody.innerHTML=liste.map(h=>`<tr>
      <td>${tarihStr(h.tarih)}</td>
      <td>${h.aciklama}</td>
      <td><span class="pill ${h.tur==='gelir'?'g':'r'}">${h.kategori||h.tur}</span></td>
      <td class="num ${h.tur==='gelir'?'yesil':'kirmizi'}">${h.tur==='gelir'?'+':'−'}${para(h.tutar)}</td>
      <td><button class="sil-x" onclick="kasaSil('${h.id}')">×</button></td>
    </tr>`).join('') || '<tr><td colspan="5" class="empty">Hareket yok</td></tr>';
  }
}

function kasaHareketModal(){
  let tur='gelir';
  modalAc(`<div class="modal-title">Kasa Hareketi</div>
  <div class="formgrid">
    <div style="display:flex;gap:10px">
      <button type="button" class="turbtn gelir-on" id="tbtn-g" onclick="kasaTurSec('gelir')">+ Gelir</button>
      <button type="button" class="turbtn" id="tbtn-gi" onclick="kasaTurSec('gider')">− Gider</button>
    </div>
    <div><div class="lbl">Tarih</div><input type="date" id="kh-tarih" value="${bugun()}"></div>

function kasaTurSec(t){
  window._kasaTur=t;
  document.getElementById('tbtn-g').className='turbtn'+(t==='gelir'?' gelir-on':'');
  document.getElementById('tbtn-gi').className='turbtn'+(t==='gider'?' gider-on':'');
}

function kasaHareketKaydet(){
  const tarih=document.getElementById('kh-tarih').value||bugun();
  const aciklama=document.getElementById('kh-aciklama').value.trim();
  const tutar=parseFloat(document.getElementById('kh-tutar').value)||0;
  const kategori=document.getElementById('kh-kategori').value;
  if(!tutar){ toast('Tutar giriniz!','var(--red)'); return; }
  D.kasaHareketleri.push({id:uid(),tarih,tur:window._kasaTur||'gelir',aciklama,tutar,kategori});
  kaydet(); modalKapatDirekt(); renderTab('kasa'); toast('Hareket kaydedildi ✓');
}

function kasaSil(id){
  if(!confirm('Bu hareketi silmek istiyor musunuz?')) return;
  D.kasaHareketleri=D.kasaHareketleri.filter(x=>x.id!==id);
  kaydet(); renderTab('kasa'); toast('Hareket silindi','var(--amber)');
}

function renderRaporlar(m){
  // Aylık üretim
  const ay={};
  D.uretimKayitlari.forEach(u=>{
    const k=u.tarih?.slice(0,7)||'';
    if(!k) return;
    ay[k]=(ay[k]||0)+u.adet;
  });
  const aySatis={};
  D.satislar.forEach(s=>{
    const k=s.tarih?.slice(0,7)||'';
    if(!k) return;
    aySatis[k]=(aySatis[k]||0)+s.toplam;
  });
  const aylar=Array.from(new Set([...Object.keys(ay),...Object.keys(aySatis)])).sort().slice(-6);
  const maxU=Math.max(...aylar.map(k=>ay[k]||0),1);
  const maxS=Math.max(...aylar.map(k=>aySatis[k]||0),1);

  // Ürün bazlı satış
  const urunSatis={};
  D.satislar.forEach(s=>(s.kalemler||[]).forEach(k=>{ urunSatis[k.urunId]=(urunSatis[k.urunId]||0)+k.adet; }));
  const topUrun=Object.entries(urunSatis).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxTopU=Math.max(...topUrun.map(x=>x[1]),1);

  // Makine verimi
  const makineUr={};
  D.uretimKayitlari.forEach(u=>{ makineUr[u.makinaId]=(makineUr[u.makinaId]||0)+u.adet; });

  m.innerHTML=`
  <div class="card">
    <div class="mtitle">📅 Aylık Üretim & Satış (Son 6 Ay)</div>
    <div class="chart-wrap">
      ${aylar.map(k=>`<div class="chart-col">
        <div class="chart-bars">
          <div class="cbar t" style="height:${Math.round((ay[k]||0)/maxU*100)}%"></div>
          <div class="cbar g" style="height:${Math.round((aySatis[k]||0)/maxS*100)}%"></div>
        </div>
        <div class="chart-lbl">${k.slice(5)}.${k.slice(2,4)}</div>
      </div>`).join('') || '<div class="empty">Veri yok</div>'}
    </div>
    <div style="display:flex;gap:16px;margin-top:10px;font-size:12px;">
      <span><span style="color:var(--teal)">■</span> Üretim (levha)</span>
      <span><span style="color:var(--green)">■</span> Satış (₺)</span>
    </div>
    <div style="margin-top:14px;font-size:13px;">
      ${aylar.map(k=>{
        const levha=ay[k]||0;
        // m² o ay üretim
        const m2=D.uretimKayitlari.filter(u=>u.tarih?.slice(0,7)===k).reduce((s,u)=>s+adettenM2(u.adet,u.boyutId),0);
        return `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #262837;gap:8px">
          <span>${k}</span>
          <span class="teal">${levha.toLocaleString()} levha / ${m2Str(m2)}</span>
          <span class="yesil">${para(aySatis[k]||0)}</span>
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="row2">
    <div class="card">
      <div class="mtitle">🏆 En Çok Satılan Ürünler</div>
      ${topUrun.map(([uid,adet])=>`
        <div class="bar-row">
          <div class="name">${urunAd(uid)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(adet/maxTopU*100)}%"></div></div>
          <div class="bar-val">${adet.toLocaleString()} levha</div>
        </div>`).join('') || '<div class="empty">Veri yok</div>'}
    </div>
    <div class="card">
      <div class="mtitle">🏭 Makine Üretim Özeti</div>
      ${D.makineler.map(mk=>`
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #262837;font-size:13px;">
          <span>${mk.ad}</span>
          <span class="teal">${(makineUr[mk.id]||0).toLocaleString()} levha</span>
        </div>`).join('') || '<div class="empty">Makine yok</div>'}
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;font-weight:700;">
        <div style="display:flex;justify-content:space-between;">
          <span>Toplam Levha</span>
          <span class="teal">${D.uretimKayitlari.reduce((s,u)=>s+u.adet,0).toLocaleString()} adet</span>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:4px;font-weight:600;font-size:12px;">
          <span style="color:var(--mut)">Toplam m²</span>
          <span class="teal">${m2Str(D.uretimKayitlari.reduce((s,u)=>s+adettenM2(u.adet,u.boyutId),0))}</span>
        </div>
      </div>
    </div>
  </div>`;
}

// Veri aktarım
function veriAktar(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='levha-panel-yedek.json'; a.click();
}
function veriIcAl(){
  const input=document.createElement('input'); input.type='file'; input.accept='.json';
  input.onchange=e=>{
    const r=new FileReader();
    r.onload=ev=>{ try{ D=veriNormalize(JSON.parse(ev.target.result)); kaydet(); hdrGuncelle(); renderTab('ozet'); toast('Veri içe aktarıldı ✓'); }catch{ toast('Geçersiz dosya!','var(--red)'); }};
    r.readAsText(e.target.files[0]);
  };
  input.click();
}
function sifirla(){
  if(!confirm('TÜM VERİLER SİLİNECEK! Emin misiniz?')) return;
  if(!confirm('Son onay: Gerçekten sıfırlamak istiyor musunuz?')) return;
  D=varsayilanVeri(); kaydet(); renderTab('ozet'); toast('Veriler sıfırlandı','var(--amber)');
}

// ── INIT ─────────────────────────────────────────────
(async function init(){
  const mesaj = document.getElementById('kilit-mesaj');
  const tuslar = document.querySelectorAll('.pin-tus');
  mesaj.textContent = '☁️ Veriler yükleniyor...';
  // Yükleme bitene kadar tuş takımını kilitle (eski PIN ile açılmasın)
  tuslar.forEach(t=>{ t.disabled=true; t.style.opacity='.45'; });

  // Firebase yanıt vermezse en fazla 8 sn bekle, sonra yerel veriyle devam et
  try{
    await Promise.race([
      fbYukle(),
      new Promise(r=>setTimeout(r,8000))
    ]);
  }catch(e){ console.warn('Başlangıç yükleme hatası:', e); }

  D = veriNormalize(D); // sadece bellekte onar — diske yazma (başka sekmeyi ezmesin)

  tuslar.forEach(t=>{ t.disabled=false; t.style.opacity=''; });
  pinGirisi=''; guncellePinNoktalar();
  mesaj.textContent = 'PIN kodunuzu girin';
  document.getElementById('son-guncelleme').textContent = simdi();

  fbDinle();
})();
</script>
